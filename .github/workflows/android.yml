name: Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Опубликовать релиз (обновление для приложения)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Сборка подписанного APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.ver.outputs.name }}
      outcome: ${{ steps.build.outcome }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 3

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        run: |
          set +e
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          if [ -z "${ANDROID_HOME:-}" ] && [ -d /usr/local/lib/android/sdk ]; then
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          fi
          SDKM="$(command -v sdkmanager)"
          if [ -z "$SDKM" ]; then
            SDKM="$(find /usr/local/lib/android "${ANDROID_HOME:-/nonexistent}" -name sdkmanager -type f 2>/dev/null | head -n1)"
          fi
          echo "sdkmanager: $SDKM"
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses >/dev/null 2>&1
            "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -n 5
          fi
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}" 2>/dev/null | head -n 20
          exit 0

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Номер версии
        id: ver
        run: |
          CODE="${{ github.run_number }}"
          NAME="1.0.${CODE}"
          echo "code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "apk=BlueOceanIT-${NAME}.apk" >> "$GITHUB_OUTPUT"
          echo "Версия: ${NAME} (versionCode ${CODE})"

      - name: Сборка release APK (постоянный ключ)
        id: build
        continue-on-error: true
        env:
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'BlueOcean2026Strong!' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'blueocean' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'BlueOcean2026Strong!' }}
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Лог ошибки в комментарий коммита
        if: steps.build.outcome == 'failure'
        run: |
          tail -n 400 build.log > build-error.log
          python3 - <<'PY'
          import json, os, urllib.request
          text = open('build-error.log', encoding='utf-8', errors='replace').read()[-60000:]
          payload = {"body": "**Сборка не удалась**\n```\n" + text + "\n```"}
          repo = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['GITHUB_SHA']
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/commits/{sha}/comments",
              data=json.dumps(payload).encode(),
              headers={
                  "Authorization": "Bearer " + os.environ['GITHUB_TOKEN'],
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "ci",
              },
              method="POST",
          )
          try:
              urllib.request.urlopen(req).read()
              print("comment posted")
          except Exception as e:
              print("failed to post:", e)
          PY
          exit 1
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Проверка подписи и подготовка файла
        id: apk
        if: steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          BUILD_TOOLS="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | tee signature.txt
          OUT="${{ steps.ver.outputs.apk }}"
          cp "$APK" "$OUT"
          SHA="$(sha256sum "$OUT" | cut -d' ' -f1)"
          SIGNER="$(grep -m1 'SHA-256 digest' signature.txt | sed 's/^.*: //')"
          SIZE="$(du -h "$OUT" | cut -f1)"
          {
            echo "sha=${SHA}"
            echo "signer=${SIGNER}"
            echo "size=${SIZE}"
          } >> "$GITHUB_OUTPUT"
          echo "APK: $OUT ($SIZE), sha256=$SHA"

      - name: Артефакт сборки
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: BlueOceanIT-${{ steps.ver.outputs.name }}
          path: |
            ${{ steps.ver.outputs.apk }}
            signature.txt
          retention-days: 30

      # Релиз с версией публикуется на КАЖДЫЙ push, а не только в main:
      # /releases/latest должен всегда указывать на свежий APK, иначе приложение
      # (и особенно старые установленные версии) не видит обновлений.
      - name: Публикация релиза версии
        if: steps.build.outcome == 'success' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release))
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: Blue Ocean IT ${{ steps.ver.outputs.name }}
          make_latest: true
          fail_on_unmatched_files: true
          files: ${{ steps.ver.outputs.apk }}
          body: |
            ## Blue Ocean IT ${{ steps.ver.outputs.name }}

            APK подписан **постоянным ключом** — устанавливается поверх предыдущей версии,
            данные и настройки сохраняются. Просто скачайте файл на телефон и откройте его.

            - Размер: ${{ steps.apk.outputs.size }}
            - SHA-256: `${{ steps.apk.outputs.sha }}`
            - Сертификат подписи: `${{ steps.apk.outputs.signer }}`
            - Коммит: ${{ github.sha }}

            Приложение само проверяет этот релиз (GitHub Releases API), скачивает APK,
            сверяет подпись с установленной и запускает установщик.

      - name: Сборка для ветки (prerelease, можно ставить сразу)
        if: steps.build.outcome == 'success' && github.ref != 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-build
          name: Dev build — актуальная сборка ветки
          prerelease: true
          make_latest: false
          files: ${{ steps.ver.outputs.apk }}
          body: |
            Тестовая сборка ветки `${{ github.ref_name }}` — ${{ steps.ver.outputs.name }}.
            - SHA-256: `${{ steps.apk.outputs.sha }}`
            - Сертификат подписи: `${{ steps.apk.outputs.signer }}`
            - Размер: ${{ steps.apk.outputs.size }}

      # Оставляем в общем релизе только три последних APK: старые версии никому не нужны,
      # а раздутый список файлов раньше и приводил к тому, что «свежим» считался 1.0.18.
      - name: Почистить старые APK в dev-build
        if: steps.build.outcome == 'success' && github.ref != 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REL="$(gh api repos/${{ github.repository }}/releases/tags/dev-build)" || exit 0
          ID="$(echo "$REL" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          gh api "repos/${{ github.repository }}/releases/$ID/assets?per_page=100" > assets.json
          python3 - > old-assets.txt <<'PY'
          import json, re
          data = json.load(open('assets.json'))
          def key(a):
              m = re.search(r'(\d+(?:\.\d+)+)', a['name'])
              return [int(x) for x in m.group(1).split('.')] if m else [0]
          apks = sorted([a for a in data if a['name'].lower().endswith('.apk')], key=key)
          for a in apks[:-3]:
              print(a['id'], a['name'])
          PY
          while read -r AID NAME; do
            [ -z "$AID" ] && continue
            echo "удаляю $NAME"
            gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$AID" || true
          done < old-assets.txt

  smoke:
    name: Smoke-тест на эмуляторе
    needs: build
    if: needs.build.result == 'success' && (contains(github.event.head_commit.message, '[smoke]') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: APK из сборки
        uses: actions/download-artifact@v4
        with:
          name: BlueOceanIT-${{ needs.build.outputs.version }}
          path: apk

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm || echo "нет /dev/kvm"

      - name: Эмулятор и запуск приложения
        id: emu
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          exec > >(tee -a emulator.log) 2>&1
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          export ANDROID_USER_HOME="$HOME/.android"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          export PATH="$SDK/platform-tools:$SDK/emulator:$PATH"
          mkdir -p "$ANDROID_AVD_HOME"
          SDKM="$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -n1)"
          AVDM="$(find "$SDK" -name avdmanager -type f 2>/dev/null | head -n1)"
          echo "SDK=$SDK"; echo "sdkmanager=$SDKM"; echo "avdmanager=$AVDM"; echo "HOME=$HOME"
          yes | "$SDKM" --licenses > /dev/null 2>&1
          IMG="system-images;android-34;google_apis;x86_64"
          "$SDKM" "platform-tools" "emulator" "$IMG" > sdkmanager.log 2>&1
          echo "--- sdkmanager (последние строки) ---"
          tail -n 15 sdkmanager.log
          echo "--- system image на диске ---"
          ls "$SDK/system-images/android-34/google_apis/x86_64" 2>&1 | head -n 10
          "$SDK/emulator/emulator" -version 2>&1 | head -n 3
          echo "--- создание AVD ---"
          echo no | "$AVDM" create avd -n ci34 -k "$IMG" --force -d pixel_5 2>&1
          if [ ! -f "$ANDROID_AVD_HOME/ci34.ini" ]; then
            echo "повтор без указания устройства"
            echo no | "$AVDM" create avd -n ci34 -k "$IMG" --force 2>&1
          fi
          ls -la "$ANDROID_AVD_HOME" 2>&1 | head -n 10
          "$AVDM" list avd 2>&1 | head -n 15
          "$SDK/emulator/emulator" -list-avds 2>&1 | head -n 5
          if [ ! -f "$ANDROID_AVD_HOME/ci34.ini" ]; then
            echo "RESULT: AVD_NOT_CREATED"
            exit 1
          fi
          nohup "$SDK/emulator/emulator" -avd ci34 -no-window -no-audio -no-boot-anim \
            -no-snapshot -wipe-data -gpu swiftshader_indirect -camera-back none -accel auto \
            > emulator-run.log 2>&1 &
          adb start-server 2>&1 | tail -n 3
          BOOTED=0
          for i in $(seq 1 90); do
            B="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            echo "проверка $i: boot='$B' | $(adb devices | tail -n +2 | head -n1)"
            if [ "$B" = "1" ]; then BOOTED=1; break; fi
            sleep 6
          done
          echo "BOOTED=$BOOTED"
          if [ "$BOOTED" != "1" ]; then
            echo "RESULT: EMULATOR_NOT_BOOTED"
            tail -n 40 emulator-run.log
            exit 1
          fi
          APK="$(ls apk/*.apk | head -n1)"
          echo "APK: $APK"
          adb install -r "$APK" 2>&1 | tail -n 3
          adb shell pm grant by.blueocean.news android.permission.POST_NOTIFICATIONS 2>&1 | tail -n 2
          adb logcat -c
          adb shell am start -W -n by.blueocean.news/.MainActivity 2>&1 | tail -n 6
          sleep 150
          PID="$(adb shell pidof by.blueocean.news | tr -d '\r')"
          adb logcat -d > logcat.txt
          adb exec-out screencap -p > screen.png
          {
            echo "PID: ${PID:-<none>}"
            if grep -q "FATAL EXCEPTION" logcat.txt; then
              echo "RESULT: CRASH"
              grep -A 30 "FATAL EXCEPTION" logcat.txt | head -n 60
            elif [ -z "$PID" ]; then
              echo "RESULT: PROCESS_NOT_RUNNING"
              tail -n 80 logcat.txt
            else
              echo "RESULT: APP_ALIVE"
              grep -E "Displayed by.blueocean.news|Start proc.*blueocean" logcat.txt | head -n 5
            fi
            echo "--- логи приложения ---"
            grep -E "BlueOcean|OkHttp|UnknownHost|SSLHandshake" logcat.txt | tail -n 25
          } | tee smoke-result.txt
          if grep -q "FATAL EXCEPTION" logcat.txt || [ -z "$PID" ]; then exit 1; fi

          echo "--- открываю первую новость ---"
          # ждём, пока в ленте появится карточка (до 3 минут)
          for i in $(seq 1 18); do
            adb shell uiautomator dump /sdcard/ui.xml > /dev/null 2>&1
            adb pull /sdcard/ui.xml ui.xml > /dev/null 2>&1
            if grep -q 'clickable="true"' ui.xml 2>/dev/null; then
              echo "карточка найдена на попытке $i"
              break
            fi
            sleep 10
          done
          python3 - <<'PY' > tap.txt 2>/dev/null || echo "540 1200 fallback" > tap.txt
          import re
          try:
              xml = open('ui.xml', encoding='utf-8').read()
          except Exception:
              print(540, 1200, 'fallback')
              raise SystemExit
          for node in re.findall(r'<node[^>]*>', xml):
              text = re.search(r'text="([^"]*)"', node)
              bounds = re.search(r'bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', node)
              clickable = 'clickable="true"' in node
              if not (text and bounds and clickable):
                  continue
              value = text.group(1)
              if len(value) < 25:
                  continue
              x1, y1, x2, y2 = map(int, bounds.groups())
              print((x1 + x2) // 2, (y1 + y2) // 2, value[:50].replace(' ', '_'))
              break
          else:
              print(540, 1200, 'fallback')
          PY
          cat tap.txt
          X="$(cut -d' ' -f1 tap.txt)"
          Y="$(cut -d' ' -f2 tap.txt)"
          adb shell input tap "$X" "$Y"
          sleep 90
          adb logcat -d > logcat-reader.txt
          adb exec-out screencap -p > screen-reader.png
          {
            echo "Тап: $X,$Y"
            if grep -q "FATAL EXCEPTION" logcat-reader.txt; then
              echo "READER_RESULT: CRASH"
              grep -A 25 "FATAL EXCEPTION" logcat-reader.txt | head -n 50
            else
              echo "READER_RESULT: OK"
              grep -E "BlueOcean" logcat-reader.txt | tail -n 10
            fi
          } | tee reader-result.txt

          # Проверяем остальные вкладки: Тренды и Идеи
          adb shell input keyevent KEYCODE_BACK
          sleep 3
          for TAB in "Тренды" "Идеи" "Настройки"; do
            adb shell uiautomator dump /sdcard/ui.xml > /dev/null 2>&1
            adb pull /sdcard/ui.xml ui.xml > /dev/null 2>&1
            COORDS="$(python3 - "$TAB" <<'PY'
          import re, sys
          target = sys.argv[1]
          try:
              xml = open('ui.xml', encoding='utf-8').read()
          except Exception:
              print("")
              raise SystemExit
          for node in re.findall(r'<node[^>]*>', xml):
              text = re.search(r'text="([^"]*)"', node)
              bounds = re.search(r'bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', node)
              if text and bounds and text.group(1) == target:
                  x1, y1, x2, y2 = map(int, bounds.groups())
                  print((x1 + x2) // 2, (y1 + y2) // 2)
                  break
          PY
          )"
            echo "вкладка $TAB: координаты '$COORDS'"
            if [ -n "$COORDS" ]; then
              adb shell input tap $COORDS
              sleep 8
              adb exec-out screencap -p > "screen-$(echo "$TAB" | tr -d ' ').png"
            fi
          done
          # Возвращаемся на ленту, чтобы снимать её в разных ориентациях
          adb shell uiautomator dump /sdcard/ui.xml > /dev/null 2>&1
          adb pull /sdcard/ui.xml ui.xml > /dev/null 2>&1
          FEED_COORDS="$(python3 - <<'PY2'
          import re
          try:
              xml = open('ui.xml', encoding='utf-8').read()
          except Exception:
              print("")
              raise SystemExit
          for node in re.findall(r'<node[^>]*>', xml):
              text = re.search(r'text="([^"]*)"', node)
              bounds = re.search(r'bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', node)
              if text and bounds and text.group(1) == "Лента":
                  x1, y1, x2, y2 = map(int, bounds.groups())
                  print((x1 + x2) // 2, (y1 + y2) // 2)
                  break
          PY2
          )"
          if [ -n "$FEED_COORDS" ]; then adb shell input tap $FEED_COORDS; sleep 5; fi

          # Проверяем адаптивность: альбомная ориентация и планшетный размер
          echo "--- альбомная ориентация ---"
          adb shell settings put system accelerometer_rotation 0 > /dev/null 2>&1
          adb shell settings put system user_rotation 1 > /dev/null 2>&1
          sleep 6
          adb exec-out screencap -p > screen-landscape.png

          echo "--- планшетный размер ---"
          adb shell settings put system user_rotation 0 > /dev/null 2>&1
          adb shell wm size 1600x2560 > /dev/null 2>&1
          adb shell wm density 240 > /dev/null 2>&1
          sleep 8
          adb shell am force-stop by.blueocean.news
          adb shell am start -n by.blueocean.news/.MainActivity > /dev/null 2>&1
          sleep 18
          adb exec-out screencap -p > screen-tablet.png
          adb shell uiautomator dump /sdcard/ui.xml > /dev/null 2>&1
          adb pull /sdcard/ui.xml ui.xml > /dev/null 2>&1
          TABLET_SIZE="$(adb shell wm size | tr -d '\r') / $(adb shell wm density | tr -d '\r')"
          echo "размер: $TABLET_SIZE"
          if grep -q "Настройки" ui.xml 2>/dev/null; then
            echo "навигация на планшете доступна"
          fi
          adb shell wm size reset > /dev/null 2>&1
          adb shell wm density reset > /dev/null 2>&1

          # ── Регрессия автообновления ───────────────────────────────────────────
          # Ставим ПРЕДЫДУЩИЙ APK из релиза и просим приложение проверить обновления.
          # Раньше версия бралась из тега (`dev-build`), а «свежим» считался первый
          # файл в списке — приложение отвечало «у вас последняя версия», хотя релиз новее.
          echo "--- проверка автообновления на предыдущей сборке ---"
          gh release view dev-build --repo "${{ github.repository }}" \
            --json assets -q '.assets[].name' > assets.txt 2>/dev/null || true
          # Предыдущая сборка (в релизе хранятся три последних APK) и ожидаемая свежая версия
          read -r OLD_NAME NEWEST_VERSION <<<"$(python3 - <<'PY3'
          import re
          try:
              names = [l.strip() for l in open('assets.txt') if l.strip().endswith('.apk')]
          except Exception:
              names = []
          def key(n):
              m = re.search(r'(\d+(?:\.\d+)+)', n)
              return [int(x) for x in m.group(1).split('.')] if m else [0]
          names.sort(key=key)
          old = names[-2] if len(names) > 1 else ""
          newest = names[-1] if names else ""
          m = re.search(r'(\d+(?:\.\d+)+)', newest)
          print(old, m.group(1) if m else "")
          PY3
          )"
          echo "ставлю для проверки: $OLD_NAME (ожидаю обновление до $NEWEST_VERSION)"
          UPDATE_RESULT="SKIP"
          if [ -n "$OLD_NAME" ]; then
            gh release download dev-build --repo "${{ github.repository }}" \
              --pattern "$OLD_NAME" --dir old-apk --clobber 2>&1 | tail -n 2
            OLD_APK="old-apk/$OLD_NAME"
            if [ -f "$OLD_APK" ]; then
              adb install -r -d "$OLD_APK" 2>&1 | tail -n 2
              adb shell appops set by.blueocean.news REQUEST_INSTALL_PACKAGES allow > /dev/null 2>&1
              adb shell am force-stop by.blueocean.news
              adb logcat -c
              adb shell am start -n by.blueocean.news/.MainActivity > /dev/null 2>&1
              sleep 12
              # Настройки → «Проверить обновления»
              adb shell uiautomator dump /sdcard/ui.xml > /dev/null 2>&1
              adb pull /sdcard/ui.xml ui.xml > /dev/null 2>&1
              COORDS="$(python3 - "Настройки" <<'PY4'
          import re, sys
          target = sys.argv[1]
          try:
              xml = open('ui.xml', encoding='utf-8').read()
          except Exception:
              print("")
              raise SystemExit
          for node in re.findall(r'<node[^>]*>', xml):
              text = re.search(r'text="([^"]*)"', node)
              bounds = re.search(r'bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', node)
              if text and bounds and text.group(1) == target:
                  x1, y1, x2, y2 = map(int, bounds.groups())
                  print((x1 + x2) // 2, (y1 + y2) // 2)
                  break
          PY4
          )"
              if [ -n "$COORDS" ]; then adb shell input tap $COORDS; sleep 6; fi
              adb shell uiautomator dump /sdcard/ui.xml > /dev/null 2>&1
              adb pull /sdcard/ui.xml ui.xml > /dev/null 2>&1
              CHECK="$(python3 - "Проверить обновления" <<'PY5'
          import re, sys
          target = sys.argv[1]
          try:
              xml = open('ui.xml', encoding='utf-8').read()
          except Exception:
              print("")
              raise SystemExit
          for node in re.findall(r'<node[^>]*>', xml):
              text = re.search(r'text="([^"]*)"', node)
              bounds = re.search(r'bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', node)
              if text and bounds and target in text.group(1):
                  x1, y1, x2, y2 = map(int, bounds.groups())
                  print((x1 + x2) // 2, (y1 + y2) // 2)
                  break
          PY5
          )"
              echo "кнопка проверки: '$CHECK'"
              if [ -z "$CHECK" ]; then
                adb shell input swipe 540 1600 540 600 300 > /dev/null 2>&1
                sleep 2
                adb shell uiautomator dump /sdcard/ui.xml > /dev/null 2>&1
                adb pull /sdcard/ui.xml ui.xml > /dev/null 2>&1
                CHECK="$(python3 - "Проверить обновления" <<'PY5'
          import re, sys
          target = sys.argv[1]
          try:
              xml = open('ui.xml', encoding='utf-8').read()
          except Exception:
              print("")
              raise SystemExit
          for node in re.findall(r'<node[^>]*>', xml):
              text = re.search(r'text="([^"]*)"', node)
              bounds = re.search(r'bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', node)
              if text and bounds and target in text.group(1):
                  x1, y1, x2, y2 = map(int, bounds.groups())
                  print((x1 + x2) // 2, (y1 + y2) // 2)
                  break
          PY5
          )"
              fi
              if [ -n "$CHECK" ]; then adb shell input tap $CHECK; fi
              sleep 20
              adb logcat -d > logcat-update.txt
              adb exec-out screencap -p > screen-update.png
              adb shell uiautomator dump /sdcard/ui.xml > /dev/null 2>&1
              adb pull /sdcard/ui.xml ui.xml > /dev/null 2>&1
              UPDATE_RESULT="FAIL"
              FOUND="$(grep -E "update: installed=" logcat-update.txt | tail -n 1 || true)"
              echo "$FOUND"
              if [ -n "$NEWEST_VERSION" ] && echo "$FOUND" | grep -q "latest=$NEWEST_VERSION"; then
                # новая версия найдена — приложение уже скачивает APK и зовёт установщик
                UPDATE_RESULT="OK ($NEWEST_VERSION)"
              elif grep -q "У вас последняя версия" ui.xml 2>/dev/null; then
                UPDATE_RESULT="WRONG: newest version not detected"
              elif [ -n "$FOUND" ]; then
                UPDATE_RESULT="MISMATCH: expected $NEWEST_VERSION"
              elif grep -q "Доступна версия" ui.xml 2>/dev/null; then
                UPDATE_RESULT="OK (banner)"
              fi
              echo "обновление на предыдущей сборке: $UPDATE_RESULT"
              grep -o "Доступна версия [0-9.]*\|У вас последняя версия ([0-9.]*)" ui.xml 2>/dev/null | head -n 2
            fi
          fi

          {
            echo "--- вкладки ---"
            echo "UPDATE_RESULT: $UPDATE_RESULT"
            ls -la screen-*.png
            if grep -q "FATAL EXCEPTION" logcat-reader.txt; then echo "TABS_RESULT: CRASH"; else echo "TABS_RESULT: OK"; fi
            grep -E "BlueOcean" logcat-reader.txt | tail -n 5
          } | tee tabs-result.txt
          exit 0

      - name: Сохранить скриншот и логи
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ github.run_number }}
          path: |
            apk/*.apk
            screen.png
            screen-reader.png
            screen-landscape.png
            screen-tablet.png
            screen-update.png
            logcat-update.txt
            reader-result.txt
            screen-*.png
            tabs-result.txt
            emulator.log
            emulator-run.log
            logcat.txt
            smoke-result.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Скриншот в репозиторий
        if: always() && hashFiles('screen.png') != ''
        shell: bash
        run: |
          set -e
          mkdir -p docs
          cp screen.png docs/screenshot.png
          cp smoke-result.txt docs/smoke-result.txt 2>/dev/null || true
          if [ -f screen-reader.png ]; then cp screen-reader.png docs/screenshot-reader.png; fi
          if [ -f reader-result.txt ]; then cp reader-result.txt docs/reader-result.txt; fi
          [ -f "screen-Тренды.png" ] && cp "screen-Тренды.png" docs/screenshot-trends.png
          [ -f "screen-Идеи.png" ] && cp "screen-Идеи.png" docs/screenshot-ideas.png
          [ -f "screen-Настройки.png" ] && cp "screen-Настройки.png" docs/screenshot-settings.png
          [ -f screen-landscape.png ] && cp screen-landscape.png docs/screenshot-landscape.png
          [ -f screen-tablet.png ] && cp screen-tablet.png docs/screenshot-tablet.png
          [ -f screen-update.png ] && cp screen-update.png docs/screenshot-update.png
          if [ -f tabs-result.txt ]; then cp tabs-result.txt docs/tabs-result.txt; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "изменений нет"
            exit 0
          fi
          git commit -m "ci: скриншот smoke-теста [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Отчёт smoke-теста
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Smoke-тест: шаг эмулятора ${{ steps.emu.outcome }}"
            echo
            if [ -f smoke-result.txt ]; then
              echo '**Приложение на эмуляторе:**'
              echo '```'
              head -n 40 smoke-result.txt
              echo '```'
            fi
            if [ -f reader-result.txt ]; then
              echo '**Открытие новости (ридер):**'
              echo '```'
              head -n 30 reader-result.txt
              echo '```'
            fi
            echo '**Диагностика (начало):**'
            echo '```'
            head -n 55 emulator.log 2>/dev/null
            echo '```'
            echo '**Диагностика (конец):**'
            echo '```'
            tail -n 25 emulator.log 2>/dev/null
            echo '--- emulator-run.log ---'
            tail -n 20 emulator-run.log 2>/dev/null
            echo '```'
          } > smoke-report.md
          python3 - <<'PY'
          import json, os, urllib.request
          text = open('smoke-report.md', encoding='utf-8', errors='replace').read()[-60000:]
          payload = {"body": text}
          repo = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['GITHUB_SHA']
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/commits/{sha}/comments",
              data=json.dumps(payload).encode(),
              headers={
                  "Authorization": "Bearer " + os.environ['GITHUB_TOKEN'],
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "ci",
              },
              method="POST",
          )
          try:
              urllib.request.urlopen(req).read()
              print("comment posted")
          except Exception as e:
              print("failed to post:", e)
          PY
